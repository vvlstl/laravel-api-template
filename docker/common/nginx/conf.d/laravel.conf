# Корневой роутинг Laravel
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Отключение лишних логов для служебных запросов
location = /favicon.ico {
    access_log off;
    log_not_found off;
}

location = /robots.txt {
    access_log off;
    log_not_found off;
}

# Запрет доступа к любым скрытым файлам (.env, .git, etc.)
location ~ /\.(?!well-known).* {
    deny all;
}

services:
  app:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    container_name: api_app_prod
    restart: always
    environment:
      APP_ENV: prod
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - api-prod-network

  nginx:
    build:
      context: .
      dockerfile: docker/prod/nginx/Dockerfile
    container_name: api_nginx_prod
    restart: always
    ports:
      - "80:80"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - app
    networks:
      - api-prod-network

  db:
    image: postgres:16-alpine
    container_name: api_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - api-prod-network

  redis:
    image: redis:7-alpine
    container_name: api_redis_prod
    restart: always
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes
        else
          redis-server --appendonly yes
        fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - api-prod-network

volumes:
  pgdata_prod:
    driver: local
  redisdata_prod:
    driver: local

networks:
  api-prod-network:
    driver: bridge
